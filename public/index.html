<title>Séances Pilates</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0C7566">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pilates">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Mise en page : une colonne étroite, lisible sur iPad et téléphone ; en-tête, échauffement, composition, liste d'exercices, barre d'actions collée en bas. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#16241F; --muted:#5B6D67; --line:#D6DFDB;
  --accent:#0C7566; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA; --warm:#B4530A; --done:#9AA9A4;
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif; --body:'Figtree','Avenir Next',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --surface:#18231F; --ink:#E7EFEC; --muted:#93A6A0; --line:#2B3B36;
  --accent:#4CC2AE; --accent-ink:#06211B; --accent-soft:#1D3A34; --warm:#F0A15C; --done:#5E706A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#18231F; --ink:#E7EFEC; --muted:#93A6A0; --line:#2B3B36;
  --accent:#4CC2AE; --accent-ink:#06211B; --accent-soft:#1D3A34; --warm:#F0A15C; --done:#5E706A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-inline:16px;padding-block:16px 120px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:26px} h2{font-size:19px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);padding:10px 16px;font:600 15px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;min-height:44px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:500}
textarea{min-height:64px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num-wrap{display:flex;gap:6px}.num-wrap input{text-align:center;font-variant-numeric:tabular-nums}
.btn{font:600 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.sq{width:44px;padding:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{color:var(--muted);font-size:14px;margin:0}
.date{font-family:var(--display);font-size:18px}
ol.steps{margin:0;padding-left:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));column-gap:20px;gap:4px 20px}
ol.steps li{padding-left:2px}ol.steps small{color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--muted)}
.set{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.ln{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ln .g{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:end}
.ln .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-left:36px}
.ln .idx{font:700 15px var(--display);color:var(--accent);padding-bottom:12px;text-align:center}
.ln .act{display:flex;flex-wrap:wrap;gap:6px;padding-left:36px}
.ln .star{color:var(--warm);font-weight:700}
.seg.s button{padding:7px 11px;font-size:14px}
.seg button[aria-pressed="true"][data-v="r"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
.seg button[aria-pressed="true"][data-v="x"]{background:var(--warm);color:var(--accent-ink)}
.tr{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tr .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tr .nm{font:600 17px var(--display);overflow-wrap:anywhere;min-width:0;flex:1 1 200px}
.tr small{color:var(--muted);font-weight:500;font-family:var(--body);font-size:13px}
.tr .opt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:6px 0 6px 12px;border-top:1px solid var(--line)}
.tr .opt span{flex:1 1 200px;min-width:0;overflow-wrap:anywhere;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .btn.has{border-color:var(--accent)}
.mc{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 9px;margin:0 6px 0 0}
.mcs{display:flex;flex-wrap:wrap;gap:4px 0;padding-left:36px}
.mtxt{color:var(--muted);font-size:14px;margin-top:4px}
.found{display:flex;flex-direction:column;gap:6px}
.found button{text-align:left}
.found small{color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .msg{flex:1 1 100%;font-size:14px;color:var(--accent);min-height:18px;font-weight:600}
.cp{display:flex;flex-direction:column;gap:8px}
.cours-head{display:flex;flex-direction:column;gap:2px}
.cours-head .big{font:700 26px var(--display)}
.tk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font:inherit}
.tk .box{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font:700 14px var(--display);color:var(--accent);margin-top:1px}
.tk[aria-pressed="true"] .box{background:var(--warm);color:var(--accent-ink)}
.tk .no{display:none;font-size:13px;font-weight:600;color:var(--warm);margin-top:2px}
.tk[aria-pressed="true"] .no{display:block}
.tk[aria-pressed="true"] .t{color:var(--done);text-decoration:line-through}
.tk .t{font:600 20px/1.25 var(--display);overflow-wrap:anywhere}
.tk .s{color:var(--muted);font-size:17px;margin-top:2px;overflow-wrap:anywhere}
.tk[aria-pressed="true"] .s{color:var(--done)}
.det{margin:-6px 0 0 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:16px}
.tkw{display:flex;flex-direction:column;gap:6px}
.sub-t{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
</style>

<main id="app">
  <div class="top">
    <h1>Séances Pilates</h1>
    <div class="seg" role="group" aria-label="Mode">
      <button id="m-prep" data-act="mode" data-v="prep" aria-pressed="true">Préparer</button>
      <button id="m-cours" data-act="mode" data-v="cours" aria-pressed="false">Cours</button>
      <button id="m-tri" data-act="mode" data-v="tri" aria-pressed="false">Trier ma base</button>
    </div>
  </div>

  <section class="card" id="head" aria-label="En-tête de séance">
    <div class="grid">
      <label class="f">Client
        <input id="client" list="clients" autocomplete="off" placeholder="Prénom du client">
        <datalist id="clients"></datalist>
      </label>
      <label class="f">Séance
        <input id="title" autocomplete="off" placeholder="ex. Abdos alter">
      </label>
      <label class="f">N° de séance
        <div class="num-wrap"><button class="btn sq" data-act="num" data-v="-1" aria-label="Numéro précédent">−</button><input id="num" inputmode="numeric"><button class="btn sq" data-act="num" data-v="1" aria-label="Numéro suivant">+</button></div>
      </label>
      <label class="f">Date
        <input id="date" type="date">
      </label>
    </div>
    <div class="row"><span class="date" id="datefr"></span><span class="hint" id="lastinfo"></span></div>
  </section>

  <div id="prep" style="display:contents">
    <section class="card" id="warm" aria-label="Échauffement"></section>
    <section class="card" id="presets" aria-label="Choisir une séance"></section>
    <section class="card" id="lines" aria-label="Exercices de la séance"></section>
    <section class="card" aria-label="Ajouter un exercice">
      <h2>Ajouter un exercice</h2>
      <label class="f">Chercher dans ta base
        <input id="q" autocomplete="off" placeholder="ex. shoulder bridge, clams, swan…">
      </label>
      <div class="found" id="found"></div>
    </section>
  </div>
  <div id="cours" style="display:none;flex-direction:column;gap:12px"></div>
  <div id="tri" style="display:none;flex-direction:column;gap:12px"></div>
  <section class="card cp" id="cpbox" style="display:none">
    <p class="hint">La copie automatique n'a pas fonctionné ici. Le texte est sélectionné : copie-le (⌘C / appui long → Copier), puis colle-le en D10.</p>
    <textarea id="cptext" rows="8" readonly></textarea>
    <button class="btn" data-act="cpclose">Fermer</button>
  </section>
</main>

<div class="bar"><div class="in">
  <div class="msg" id="msg" role="status"></div>
  <button class="btn pri" data-act="copy">Copier pour Excel (D10)</button>
  <button class="btn" data-act="done">Séance faite ✓</button>
  <button class="btn" data-act="save">Enregistrer comme prédéfinie</button>
  <button class="btn" data-act="undo" id="undo" style="display:none">Annuler</button>
</div></div>

côté. Gainage, regard fixe."],["FESSIERS_ADD","","DEBOUT","OUVRIR BRAS","","Debout en appui sur une jambe, ouvrir les bras pour l'équilibre en engageant le fessier d'appui. Bassin stable."],["MOBILITÉ","","SPINE STRETCH","JAMBES_TENDUES","","Assise jambes tendues écartées, dérouler le buste vers l'avant en expirant, creuser le ventre, puis remonter. Étire l'arrière."],["MOBILITÉ","","MERMAID","AU SOL","","Assise jambes repliées sur un côté, un bras monte et s'incline au-dessus de la tête pour étirer le flanc. Doux pour l'épaule. Changer de côté."],["ABDOS_SIDE","","SAW","ASSIS","","Assise jambes écartées, tourner le buste et 'scier' vers le pied opposé avec la main, l'autre bras part en arrière. Rotation + étirement."],["MOBILITÉ","","ROLL BACK","MAINS SOUS CUISSES","","Assise genoux pliés, mains sous les cuisses, dérouler le bas du dos en arrière vertèbre par vertèbre puis revenir. Contrôle abdominal."],["ABDOS","","CHEST_LIFT","JAMBES PLIÉES AU SOL","","Sur le dos, genoux pliés pieds au sol, mains derrière la tête. Décoller tête et omoplates en expirant. Nuque longue, coudes ouverts."],["ABDOS","","ONE_LEG_STRETCH","CHEST LIFT","","Sur le dos en chest lift, ramener un genou vers la poitrine, l'autre jambe tendue en l'air. Alterner. Bassin stable."],["ABDOS","","DOUBLE_LEG_STRETCH","TÊTE AU SOL 1 JAMBE PLIÉE","","Sur le dos, tête au sol, tendre une jambe et garder l'autre pliée. Coordination douce. Dos ancré."],["ABDOS","","SCISSORS","JAMBES 90°","","Sur le dos, jambes à 90°, ciseaux : une jambe descend pendant que l'autre reste. Bassin stable, abdos engagés."],["ABDOS","","LIFT_AND_LOWER","JAMBES 90°","","Sur le dos, jambes à la verticale, descendre les deux jambes tendues puis remonter sans cambrer. Bas du dos collé au sol."],["MAT_FOOTWORK ","","POINTE_FLEX","","","Sur le dos, jambes en l'air, alterner pointe et flex des pieds. Réveille pieds et chevilles, travail des jambes."],["MOBILITÉ","","SPINE TWIST SUPINE","PIEDS AU SOL","","Sur le dos, bras en croix, pieds au sol. Laisser tomber les genoux d'un côté en tournant la tête à l'opposé. Épaules au sol."],["FESSIERS_ADD","","SHOULDER_BRIDGE","FLEXION EXTENSION JAMBES 90°","","Sur le dos, pieds au sol, monter le bassin en pont puis dérouler vertèbre par vertèbre. Fessiers et chaîne postérieure."],["FESSIERS_ADD","","SHOULDER_BRIDGE","LEVER LES TALONS","","En position de pont, lever et reposer les talons en gardant le bassin haut et stable. Fessiers et mollets."],["FESSIERS_ADD","","CLAMS SUR DOS (4000)","","","Sur le dos, genoux pliés et joints, ouvrir les genoux vers l'extérieur (coquille) puis refermer. Active les fessiers."],["FESSIERS_ADD","","BATTEMENTS","ABD/ADD SUR LE DOS","","Sur le dos, jambes tendues vers le plafond, écarter puis resserrer. Intérieur et extérieur des cuisses."],["FESSIERS_ADD","","SIDE_KICK_SOL","FRONT","","Couchée sur le côté, jambe du dessus à hauteur de hanche, l'amener devant puis derrière en contrôle. Bassin stable."],["FESSIERS_ADD","","SIDE_KICK_SOL","UP","","Couchée sur le côté, monter la jambe du dessus vers le plafond puis redescendre lentement. Moyen fessier."],["FESSIERS_ADD","","CLAMS_AU_SOL","+ PULSES","","Couchée sur le côté, genoux pliés, ouvrir le genou du dessus et ajouter de petites pulsations en haut. Fessier."],["ABDOS_SIDE","","ARM_OPENING","COUCHÉ SUR LE COTÉ OUVRIR BRAS TENDUS","","Couchée sur le côté, genoux pliés, bras tendus joints devant. Ouvrir le bras du dessus vers l'arrière, suivre la main du regard. Ouverture douce du thorax et de l'épaule."],["ABDOS_SIDE","","MERMAID","AU SOL","","Assise sur un côté, jambes repliées, incliner le buste et un bras au-dessus de la tête pour étirer le flanc. Sans forcer l'épaule."],["DOS","","SWAN","MAINS SOUS FRONT","","Sur le ventre, mains sous le front. Allonger et décoller légèrement le buste, nuque longue, sans pousser sur les bras. Extension douce."],["DOS","","SWIMMING","JUSTE JAMBES ROT LAT ","","Sur le ventre, bras le long du corps pour protéger l'épaule. Décoller alternativement les jambes en rotation externe. Bassin ancré."],["ABDOS","","TOUCH_AND_GO","JAMBES 90°","","Sur le dos, jambes à 90°, en chest lift léger : tendre les jambes loin puis les ramener (touch and go) sans poser la tête. Bassin stable, abdos profonds."],["ABDOS","","ROLL_UP","MAINS SOUS 1 CUISSE ","","Sur le dos, mains sous une cuisse pour s'aider, dérouler le buste pour venir assis vertèbre par vertèbre puis redescendre. Contrôle abdominal."],["MAT_FOOTWORK ","","V PILATES","","","Sur le dos, jambes en l'air talons joints pointes ouvertes (V), fléchir et tendre les jambes en gardant le bassin stable. Travail des jambes et du centre."],["FESSIERS_ADD","","ABD_ADD_AU_SOL","1 JAMBE TENDUE AU CIEL BRAS FLOTTÉS","","Sur le dos, une jambe tendue vers le plafond, bras flottés au-dessus. Écarter puis ramener la jambe (abduction/adduction). Bassin stable, ventre engagé."],["ABDOS","","CRISS_CROSS","JUSTE TWIST","","Sur le dos, mains derrière la tête, chest lift, tourner le buste pour amener un coude vers le genou opposé puis alterner. Obliques. Coudes ouverts, nuque longue."]]},{"name":"Couple · Mobilité douce","title":"COUPLE — MOBILITÉ DOUCE · épaule opérée (6 mois), sans quadrupédie","lines":[["MOBILITÉ","","ROLL DOWN","FLEXION EXTENSION","","Debout, dérouler la colonne vertèbre par vertèbre vers l'avant puis remonter. Menton vers la poitrine, bras et nuque relâchés, genoux souples."],["EQUILIBRE","","FENTE_AVANT","RAMENER PIED DEVANT","","Debout, grand pas en avant, genou arrière vers le sol, buste droit. Pousser dans le talon avant pour ramener le pied. Gainage actif, regard loin. Alterner."],["RESPIRATION","","TAILLEUR MAINS VENTRE","","","Assise en tailleur, mains sur le ventre. Inspirer en gonflant le ventre, expirer en le creusant doucement vers la colonne. Épaules basses, nuque longue."],["CEINTURE_SCA","","CERCLES_ÉPAULES ","ASSIS","","Assise, dessiner de grands cercles avec les épaules : vers l'arrière puis vers l'avant. Mouvement lent et ample, sans forcer. Mobilité douce, idéale pour l'épaule opérée."],["ABDOS_SIDE","","ARM_OPENING","COUCHÉ SUR LE COTÉ OUVRIR BRAS TENDUS","","Couchée sur le côté, genoux pliés, bras tendus joints devant. Ouvrir le bras du dessus vers l'arrière en suivant la main du regard, le thorax s'ouvre. Revenir lentement, sans douleur à l'épaule."],["ABDOS","","CHEST_LIFT","JAMBES PLIÉES AU SOL","","Sur le dos, genoux pliés pieds au sol, mains derrière la tête. Décoller tête et omoplates en expirant, nombril vers la colonne. Nuque longue, coudes ouverts."],["ABDOS","","ONE_LEG_STRETCH","CHEST LIFT","","Sur le dos en chest lift, ramener un genou vers la poitrine, l'autre jambe tendue en l'air. Alterner. Bassin stable, abdos engagés, épaules relâchées."],["MOBILITÉ","","SPINE TWIST SUPINE","PIEDS AU SOL","","Sur le dos, bras en croix, pieds au sol. Laisser tomber les genoux d'un côté en tournant la tête à l'opposé. Garder les épaules au sol. Rotation lente de la colonne."],["DOS","","SWAN","MAINS SOUS FRONT","","Sur le ventre, mains sous le front. Allonger puis décoller légèrement le buste en gardant la nuque longue, sans pousser sur les bras. Extension douce du dos, épaules basses."],["DOS","","SWIMMING","JUSTE JAMBES ROT LAT ","","Sur le ventre, bras le long du corps pour protéger l'épaule. Décoller alternativement les jambes en rotation externe, petits battements. Bassin ancré, abdos gainés."],["ETIREMENT","","FESSIERS","GRAND FESSIER AMENER GENOU SUR POITRINE","","Sur le dos, ramener un genou vers la poitrine avec les mains, l'autre jambe tendue ou pliée. Étirement du grand fessier. Épaules et nuque relâchées au sol."],["ETIREMENT","","BACK","CÂLIN DE L'OURS","","Assise, entourer les genoux avec les bras et arrondir le dos comme un câlin. Respirer dans le haut du dos. Étirement doux de toute la chaîne postérieure pour finir."]]},{"name":"Sarah Shell · Booty band","title":"SARAH SHELL — MAT BOOTY BAND","lines":[["ROLL_DOWN","","PRENDRE BAND","BAND MI-CUISSES","","Band à mi-cuisses (« halfway up your legs, mid thigh »)."],["FESSIERS_ADD","","SQUAT","BAND + BRAS AU CIEL","","Squat avec les bras : inspire, les bras montent au ciel ; expire, ils redescendent pendant que les hanches partent en arrière (comme pour s'asseoir sur un banc). Poids dans les talons, genoux pressent vers l'extérieur contre le band."],["FESSIERS_ADD","","SQUAT","PULSES BAND MI-CUISSES","","Rester en bas du squat, pulses (down/up d'un pouce). Orteils levés pour garder le poids dans les talons, épaules basses, ventre rentré."],["FESSIERS_ADD","⭐","SQUAT","PAS LATÉRAUX BAND","RESTER BAS","Mains sur les hanches, grand pas sur le côté, ramener l'autre pied, rester bas dans le squat tout du long. Alterner les directions."],["ROLL_DOWN","","TENIR","FL/EX GENOUX","","Forward fold bras relâchés, respirer dedans ; plier les genoux, tendre les jambes, puis remonter en déroulant la colonne."],["EQUILIBRE","➕","EQUI_DIAGONAL","TOUCH SOL + KICK ABD","","Squat sur 1 jambe (l'autre tendue), main opposée traverse et touche le sol en twist vers la jambe ; push off et kick latéral dans le band en remontant. Serrer la taille."],["FESSIERS_ADD","","EQUI_DIAGONAL","ABD BAND TENIR 10X","","Tout le poids sur la jambe d'appui, bras ouverts en T : kicks latéraux dans le band, jambes parallèles. Grandir à chaque kick, serrer le fessier d'appui pour stabiliser."],["EQUILIBRE","⭐","FENTE_AVANT","RAMENER PIED DEVANT","","Sur la pointe du pied arrière, hanches carrées, penché en avant depuis la taille sur jambe avant pliée, bras longs : ramener bras + jambe arrière, tap de l'orteil devant, renvoyer. Le talon d'appui s'enfonce dans le sol."],["EQUILIBRE","⭐","FENTE_AVANT","LEVER JAMBE AR + BRAS","","Même position penchée : lever la jambe arrière dans le band en levant légèrement les bras, puis swing des bras en redescendant tap au sol. Garder la jambe d'appui pliée, le poids dessus."],["ABDOS","⭐","CHEST_LIFT","TAP TALONS IN/OUT","JAMBES TENDUES","Mains derrière la tête, lever tête et poitrine, jambes serrées flottées pieds flex : tap des talons au centre du tapis, puis lever et tap à l'extérieur du tapis. Jambes légères, tout le poids dans le centre, pas d'arche dans le dos."],["ABDOS","","TOUCH_AND_GO","CHEST LIFT + JAMBES","TAP LÉGER","Jambes en tabletop : tap des talons au sol avec contrôle (à peine toucher, sans claquer), tête et poitrine restent levées."],["ABDOS","⭐","CRISS_CROSS","DEMI ÉTOILE BAND","TWIST+ABD JAMBE","Une jambe longue au sol (turn-out), elle slice dans le band ; bras opposé tendu en arrière (demi-étoile). Plier la jambe vers les orteils et reach croisé du bras, puis s'éloigner l'un de l'autre. Ancrer la hanche opposée dans le tapis."],["ABDOS","⭐","DOUBLE_LEG_STRETCH","STAR BRAS+JAMBES OUT","","Genoux dans la poitrine, flexion du buste tenue : ouvrir bras ET jambes en étoile complète (les jambes écartent le band), puis tout ramener en boule. Inspire on ouvre, expire on serre."],["FESSIERS_ADD","","SHOULDER_BRIDGE","ARTICULATION 3X LENT","","Bras le long du corps, ancrer les omoplates, rentrer le ventre, tuck du bassin et rouler monter vertèbre par vertèbre ; redescendre en articulant pareil."],["FESSIERS_ADD","⭐","SHOULDER_BRIDGE","JAMBES PAPILLON","UP TENIR BAND 8X","Bridge tenu en haut : ouvrir les genoux dans le band (flare) et revenir. Fessiers serrés pour garder les hanches hautes."],["FESSIERS_ADD","⭐","SHOULDER_BRIDGE","JAMBES PAPILLON","+ HIP DIP PLAT 8X","Même bridge : descendre/monter les hanches dos plat (sans articuler) + ouvrir les genoux dans le band en haut. Abdos engagés."],["FESSIERS_ADD","⭐","SHOULDER_BRIDGE","FIGURE 4 GENOU OUT","+ PULSES G/D","Cheville croisée sur le genou opposé (figure 4), presser ce genou vers l'ouverture pendant toute la montée/descente ; puis tenir en haut et pulses. Hanches égales, presser dans les paumes."],["ABDOS","⭐","ONE_LEG_STRETCH","CHEST LIFT","FIG 4 TAP + BASCULE","Jambes en figure 4 ramenées vers la poitrine, le buste vient à leur rencontre coudes vers le genou, ouvrir les coudes quand l'orteil tap au sol ; ajouter la bascule : décoller le coccyx du tapis (bas des abdos)."],["ABDOS","","SCISSORS","JAMBES TENDUES CHEST LIFT","","Une jambe au plafond, marcher avec les mains le long de la jambe pour monter, puis scissor switch : reach vers les chevilles, coudes larges, omoplates décollées du tapis."],["FESSIERS_ADD","⭐","CLAMS_SUR_COUDES","HYDRANT JBE PLIÉE UP","BAND 10X","Sur l'avant-bras, hanches empilées : lever toute la jambe pliée (genou ET cheville montent ensemble) dans le band, façon hydrant. Hanche du haut tirée vers l'avant pour ne pas rouler en arrière, cage vers le plafond."],["FESSIERS_ADD","","SIDE_KICK_COUDES","DEVELOPPÉ","VERS COUDE 8X","Jambe à hauteur de hanche : plier le genou vers le coude puis tendre loin. Rester grand dans la taille."],["FESSIERS_ADD","","SIDE_KICK_COUDES","FRONT","FRONT","Jambe tendue hauteur hanche : sweep devant, reach derrière légèrement up. Buste levé et stable."],["FESSIERS_ADD","","SIDE_KICK_COUDES","UP + PULSES 3X","PIED FLEX BAND 8X","Pied flex, jambe centrée : pulses vers le haut dans le band."],["ABDOS","","REVERSE_PLANK","ENLEVER BAND","UP TÊTE AR","Enlever le band. Doigts derrière les hanches tournés vers elles, sous les épaules, pieds plantés : lever les hanches, ouvrir la poitrine, tête en arrière, puis revenir."],["ABDOS","➕","REVERSE_PLANK","TRICEPS HANCHES SOL","4X x3","Hanches posées au sol et immobiles : plier les coudes (triceps press), les coudes se serrent l'un vers l'autre. En alternance avec le teaser."],["ABDOS","➕","TEASER","3X ALTERNÉ TRICEPS","","Trouver l'équilibre, monter en teaser bras devant, reach-reach-reach, redescendre lentement avec contrôle. Circle des bras pour remonter."],["ETIREMENT","⭐","FESSIERS","PIRIFORME","GENOUX EMPILÉS FOLD","Assis, jambes croisées genoux empilés au maximum : forward fold tête lourde (la gravité fait l'étirement), rock doucement gauche-droite, respirer et relâcher."]]},{"name":"Sarah Shell · Full body ballon","title":"SARAH SHELL — FULL BODY MAT · petit ballon + haltères 3 lb · Vidéo 6295","lines":[["ROLLING","⭐","BERCER GENOUX","POITRINE","","Assis, attraper l'arrière des cuisses, grandir, puis expirer en creusant le ventre et se dérouler en arrière en ramenant les genoux à la poitrine. Bercer doucement G/D, respiration ample."],["ETIREMENT","","LOMBAIRES","SPINE_TWIST_SUPINE","JAMBE CROISÉE","Sur le dos, un PIED AU SOL, une jambe croisée sur l'autre, laisser tomber les genoux sur le côté. Position tenue = étirement colonne/lombaires. G/D."],["FESSIERS_ADD","","SHOULDER_BRIDGE","BALLE ENTRE GENOUX","","Ballon entre les genoux, bras le long du corps. Dérouler la colonne vertèbre par vertèbre en serrant le ballon, monter puis redescendre lentement."],["FESSIERS_ADD","","SHOULDER_BRIDGE","BALLE ENTRE GENOUX","PRESSÉ","En haut du pont, hanches hautes, presser le ballon entre les genoux en tenue. Fessiers actifs, nuque longue, tête lourde."],["FESSIERS_ADD","","SHOULDER_BRIDGE","BALLE ENTRE GENOUX","+ MONTER DIRECT","Charnière des hanches : taper le coccyx vers le tapis puis remonter les hanches direct (sans dérouler) en serrant le ballon, en poussant dans les paumes. Réveille l'arrière des cuisses."],["FESSIERS_ADD","","SHOULDER_BRIDGE","BALLE ENTRE GENOUX","PULSE","Hanches en haut, descendre d'un cm puis remonter d'un cm en serrant le ballon. Petites pulsations contrôlées, ventre rentré."],["FESSIERS_ADD","⭐","SHOULDER_BRIDGE","BALLE SOUS LE GENOU","TAP / BATTEMENT","ASTUCE : monter d'abord en pont (déjà en haut), puis placer le ballon SOUS le genou de la jambe qui se LÈVE (talon vers la fesse). Taper/battre l'autre pied au sol et remonter, hanches hautes et égales. G/D. Vidéo 6295."],["FESSIERS_ADD","⭐","SHOULDER_BRIDGE","BALLE SOUS LE GENOU","MONTER DIRECT","Même position (déjà en haut), ballon SOUS le genou de la jambe qui se LÈVE. Montée-descente directe du pont sur une jambe (sans dérouler). Ne pas cambrer, ventre engagé. G/D. Vidéo 6295."],["RELÂCHEMENT","","SHAKE OUT LEGS","","","Secouer les jambes quelques secondes pour relâcher entre deux séries (pas un exercice, juste une détente). Vidéo 6295."],["ABDOS","⭐","CHEST_LIFT","JAMBES 90°","BALLE SUR MOLLETS","Jambes en tabletop (90°), ballon posé sur les mollets/tibias, jambes serrées. Mains derrière la tête, monter le buste vers les cuisses en gardant le ballon stable, descendre lentement. Vidéo 6295."],["ABDOS","","CHEST_LIFT","JAMBES 90°","+ PULSE","Pause en haut du chest lift, petites pulsations vers le haut (lift higher), omoplates décollées. Existe dans ta BASE."],["ABDOS","⭐","CHEST_LIFT","JAMBES TENDUES","ROULER BALLE JAMBES","Jambes tendues, ballon entre les chevilles puis roulé sur les jambes vers les chevilles avec les mains en montant tête/buste. Presser fort dans le ballon, jambes stables. ABDO TRÈS DIFFICILE. Nouveauté (jamais fait). Vidéo 6295."],["ABDOS","","LIFT_AND_LOWER","BALLE CHEVILLES CHEST LIFT","","Ballon entre les chevilles, mains derrière la tête, buste levé (chest lift). Descendre les jambes tendues à l'inspir le plus bas sans cambrer, remonter à l'expir. Existe dans ta BASE."],["ABDOS","⭐","BALL_OVERHEAD_TRANSFER","","","Sur le dos, ballon dans les mains bras tendus au-dessus de la tête, tête et jambes au sol. Expirer : monter EN MÊME TEMPS les jambes et la tête/buste, déposer le ballon entre les chevilles. Inspirer, redescendre tête+jambes (ballon aux chevilles), puis remonter et reprendre le ballon dans les mains. On TRANSFÈRE le ballon mains <-> chevilles à chaque répétition. Abdos très engagés. Vidéo 6295."],["ABDOS","","ROLL_OVER","BASE BALLE ENTRE CHEVILLES","","Sur le dos, ballon entre les chevilles. Roll over BASE : creuser le ventre, décoller le bassin et rouler les jambes vers l'arrière (version de base, pas la version jambes tendues). Revenir en contrôle. Existe dans ta BASE."],["ABDOS","","ROLL_UP","BALLE MAINS","","Bras tendus, ballon dans les mains. Décoller la tête, plonger le buste au-dessus des jambes (étirement), grandir au maximum puis se dérouler lentement, vertèbre par vertèbre. Existe dans ta BASE."],["ETIREMENT","⭐","OUVERTURE THORACIQUE","BALLE OMOPLATES","","Ballon entre les omoplates, se rouler en arrière dessus, bras en chandelier, tête au sol. Cambrer, ouvrir la cage thoracique et la poitrine, tout relâcher. (Proche de ton 'BALLE SOUS DOS CHEST EXPANSION/LIFT'.) Vidéo 6295."],["ABDOS","⭐","SCISSORS","JAMBES 90° CHEST LIFT","BALLE SOUS DOS","Sur le dos, ballon SOUS le dos (soutien), chest lift, jambes à 90°. Ciseaux : une jambe descend pendant que l'autre reste, tête en arrière sur le ballon entre chaque. Pas si simple. G/D. Vidéo 6295."],["ABDOS","⭐","CRISS_CROSS","JAMBES TENDUES","BALLE SOUS DOS","Sur le dos, ballon SOUS le dos, chest lift, jambes tendues. Ramener le coude opposé vers le genou en twist. TRÈS DIFFICILE. (Pas de pulse final - tu ne le fais jamais.) G/D. Vidéo 6295."],["ABDOS","⭐","ROLL_BACK","BALLE DOS + HALTÈRES","OFFRANDE","Assis, ballon derrière le bas du dos, abdos creusés en C, haltères. Reculer en s'appuyant dans le ballon (garder le C) puis lever la poitrine — bras 'offrande'. Cage thoracique enroulée. Vidéo 6295."],["ABDOS","⭐","ROLL_BACK","BALLE DOS + HALTÈRES","BICEPS","Même position roll back, ballon derrière le dos. Flexion biceps : reculer, déplier, lever la poitrine. Clavicules larges, coudes un peu écartés du corps. Vidéo 6295."],["ABDOS","⭐","ROLL_BACK","BALLE DOS + HALTÈRES","FLEXION EXTENSION","Même position roll back, ballon derrière le dos. Flexion/extension des bras (alternée dans les mains), en levant la poitrine à chaque retour dans le ballon. Vidéo 6295."],["ABDOS_SIDE","⭐","ROLL_BACK","BALLE DOS + HALTÈRES","TWIST COUDE ARRIÈRE","Assis, ballon derrière le dos, haltères. Twist vers l'arrière : amener le coude en arrière vers le tapis en s'appuyant dans le ballon, lever la poitrine, alterner (toucher le coude derrière). Tu aimes beaucoup - nom à confirmer. Vidéo 6295."],["CERVICALES","⭐","CATS","BALLE GENOUX + PÉRINÉE","","À quatre pattes, ballon entre les genoux. Cat-cow : expirer dos rond menton/coccyx rentrés en serrant le ballon (engagement périnée), puis relâcher épaules, ouvrir la poitrine, coccyx et menton hauts."],["ABDOS","⭐","PLANCHE","TAP GENOUX BALLE","","Depuis quatre pattes/down dog, planche ballon entre les genoux, hanches alignées avec la colonne, épaules basses. Taper genoux (ballon) au sol puis tendre en arrière. Ventre rentré."],["FESSIERS_ADD","⭐","BALANCIER","HALTÈRES+BALLE GENOU","FLEX EXT BRAS","À genoux, ballon entre les genoux, haltères. BALANCIER : charnière, reculer en tendant les bras devant et revenir (flexion/extension des bras), hanches au-dessus des genoux. Tu as le balancier haltères mais PAS avec balle entre genoux -> option à ajouter. Vidéo 6295."],["CEINTURE_SCA","⭐","KNEELING_HINGE","HALTÈRES+BALLE GENOU","RAME ARRIÈRE","À GENOUX, CORPS EN AVANT (charnière des hanches, buste avancé, fesses vers les talons), haltères, ballon entre genoux. Les bras partent en arrière (rame), pulse d'un cm, serrer les omoplates, poitrine vers l'avant. Nouvel exercice. Vidéo 6295."],["CEINTURE_SCA","⭐","KNEELING_HINGE","HALTÈRES+BALLE GENOU","FLIP PAUMES","Même position à genoux corps en avant. Retourner les paumes (haut/bas) en gardant les bras levés vers le plafond. Vidéo 6295."],["BRAS_HALTÈRES","⭐","KNEELING_HINGE","HALTÈRES+BALLE GENOU","TRICEPS","Même position. Paumes face à face, plier puis tendre en arrière (triceps), omoplates serrées, extension complète. Vidéo 6295."],["BRAS_HALTÈRES","⭐","KNEELING_HINGE","HALTÈRES+BALLE GENOU","PLIER/TENDRE 2 UP","Même position. 'Mettre ensemble' : plier (bend in), tendre en arrière (extend), puis double pulse vers le haut (up + up). Vidéo 6295."],["BRAS_HALTÈRES","⭐","KNEELING_HINGE","HALTÈRES+BALLE GENOU","PAUMES FACE LEVÉ","Même position. Paumes face à face, bras levés vers le plafond, serrer en tenue. Vidéo 6295."],["CEINTURE_SCA","⭐","KNEELING_HINGE","HALTÈRES+BALLE GENOU","OVERHEAD CHARNIÈRE","Bras montent au-dessus de la tête (hanches hautes au-dessus des genoux), puis flip des paumes + charnière fesses en arrière, dos plat. Transition overhead. Vidéo 6295."],["CEINTURE_SCA","⭐","KNEELING_HINGE","HALTÈRES+BALLE GENOU","OVERHEAD CERCLES","À genoux corps en avant. Ouvrir les bras à mi-chemin puis expirer au-dessus de la tête (cercles overhead). Épaules basses, bras arrondis. Nouvel exercice. Vidéo 6295."],["ABDOS_SIDE","⭐","KNEELING_SIDE_PLANK","HALTÈRE + JAMBE","","À genoux, jambe tendue sur le côté (orteils vers l'avant, hanches face devant), main au sol épaule/poignet alignés, haltère(s) dans l'autre main. Plier/tendre le bras, puis lever la jambe parallèle au sol, taper orteils, pulse. Hanches vers l'avant. G/D."],["ABDOS_SIDE","⭐","KNEELING_SIDE_OVER","HALTÈRE","","À genoux, jambe tendue côté, haltère monte et passe au-dessus vers le sol puis remonte par l'oblique (side over). Main libre derrière la tête (ou tendue = plus facile). Rester long, ne pas arrondir le dos, hanches en avant. Pulse en diagonale. G/D."],["BRAS_HALTÈRES","⭐","KNEELING_HINGE","TRICEPS 1 BRAS","","À genoux, haltère un bras tendu vers le plafond, l'autre main guide le poignet. Fesses en arrière (charnière), plier puis presser triceps, coudes près des oreilles, cage enroulée. G/D."],["FESSIERS_ADD","⭐","SIDE_KICK_COUDES","WRAP GENOU BALLE","","Sur l'avant-bras, ballon derrière le genou (talon vers la fesse), ouvrir hanche et épaule, poitrine loin du sol. Genou pointé qui va vers le coude puis s'enroule en arrière (wrap), en restant levé. G/D."],["FESSIERS_ADD","⭐","CLAMS_SUR_COUDES","HYDRANT BALLE","","Sur l'avant-bras, genoux empilés, lever en fire hydrant (genou plié vers le plafond) + pulse. Ne pas s'effondrer dans la hanche d'appui, poids dans la paume avant. G/D."],["FESSIERS_ADD","⭐","SIDE_KICK_COUDES","FLEX KICK CIEL","","Pied flex, cuisse qui monte, kick vers le plafond puis ramener le genou au sol. Serrer le ballon, épaules basses. G/D."],["FESSIERS_ADD","⭐","SIDE_KICK_COUDES","TALON/FESSE THIGH LIFT","","Talon vers la fesse (serrer le ballon) en gardant la cuisse levée (ne pas la laisser tomber), tenue puis petites pulses vers le plafond. Bas-ventre engagé. G/D."],["FESSIERS_ADD","⭐","CLAMS_SUR_COUDES","HYDRANT ALTERNÉ","","Alterner : descendre, kick vers le plafond / sortir et monter (hydrant). Contrôle et respiration. G/D."],["BRAS_ONLY","⭐","KNEELING_CHEST_PRESS","MICRO","","À genoux, hanches avancées (fessiers serrés, poitrine loin du sol), coudes près du corps. Mini-flexion (micro bend) puis pousser. Abdos engagés, pas d'affaissement lombaire."],["DOS","⭐","SWAN","MAINS SUR BALLE","","Sur le ventre, paumes empilées sur le ballon, nez vers le tapis, jambes écartées. Pubis lourd, omoplates basses, lever tête/buste en extension en poussant fermement dans le ballon, ventre décollé. Plus les mains sont hautes sur le ballon, plus c'est facile."],["DOS","⭐","SWAN","1 BRAS SUR BALLE","","Extension du dos avec une seule paume sur le ballon, l'autre bras tendu en arrière vers la hanche. Alterner. Ventre bien rentré. G/D."],["DOS","⭐","SWIMMING","BALLE TRANSFERT DOS","","Sur le ventre, ballon dans les mains, jambes écartées. Inspirer : lever bras + jambes (ventre décollé), passer le ballon derrière le dos d'une main à l'autre, revenir, reposer. Option : haut du dos seul si trop. G/D."],["DOS","⭐","SWAN","BALLE COUDES SOL","","Extension paumes sur le ballon, pause en haut, puis poser les coudes au sol et pousser le ballon loin. Garder le ventre engagé."],["ETIREMENT","⭐","FENTE GENOU SIDE STRETCH","BRAS CIEL","","À genoux, un pied devant, hanches poussées vers l'avant, poitrine ouverte. Main avant sur le genou, bras opposé tendu vers le ciel, inclinaison latérale. G/D."],["ETIREMENT","","ISCHIOS","JAMBE TENDUE DROP TÊTE","","Depuis la fente, reculer les hanches, tendre la jambe avant, laisser tomber la tête pour étirer l'arrière de la cuisse. G/D."],["ETIREMENT","","PSOAS","PIGEON MAINS EN APPUI","","Depuis la planche, amener un genou vers l'avant en pigeon, grandir hors des hanches puis plier le buste sur la jambe, basculer vers le côté opposé const opts = (f,g) => Object.keys((F[f]||{})[g] || {});
const subs = (f,g,i) => Object.keys((((F[f]||{})[g])||{})[i] || {});
const rnd = a => a[Math.floor(Math.random()*a.length)];
const use = (f,g,i) => USE[f+'|'+g+(i ? '|'+i : '')] || [0,0];
const wt = n => 1 + Math.log(1 + n);
function wrnd(items, nf){
  if(!P.set.fav) return rnd(items);
  const ws = items.map(x => wt(nf(x))); let t = ws.reduce((a,b) => a+b, 0), r = Math.random()*t;
  for(let k=0;k<items.length;k++){ r -= ws[k]; if(r <= 0) return items[k]; }
  return items[items.length-1];
}
function wshuf(arr, nf){
  return arr.map(x => [Math.pow(Math.random(), 1/(P.set.fav ? wt(nf(x)) : 1)), x]).sort((a,b) => b[0]-a[0]).map(a => a[1]);
}
const tri = (...k) => P.tri[k.join('|')] || '';
const allowed = st => st === '' || (st === 'r' && P.set.rare);
function pickOpt(f, g){
  const o = opts(f,g).filter(i => allowed(tri(f,g,i)));
  const i = o.length && Math.random() < .85 ? wrnd(o, x => use(f,g,x)[0]) : '';
  const sb = i ? subs(f,g,i) : []; const j = sb.length && Math.random() < .5 ? rnd(sb) : '';
  return [i, j];
}

// Génération
function pool(f, used, avoid, need){
  const s = P.set;
  const all = exos(f).filter(g => !used.has(f+'|'+g) && allowed(tri(f,g)));
  let ok = all.filter(g => {
    const t = T[f+'|'+g]; if(!t) return true;
    if(t[1] !== 'sans' && !s.mat.includes(t[1])) return false;
    if(s.noQuad && t[2] === 'quadrupédie') return false;
    if(s.baseOnly && t[3] && t[3] !== 'base') return false;
    return true;
  });
  if(need && s.mat.includes('haltères')){ const h = ok.filter(g => T[f+'|'+g] && T[f+'|'+g][1]==='haltères'); if(h.length) ok = h; }
  if(avoid){ const b = ok.filter(g => !avoid.has(f+'|'+g)); if(b.length) ok = b; }
  return ok.length ? ok : all;
}
function pick(f, used, avoid, need){
  const p = pool(f, used, avoid, need); if(!p.length) return null;
  const g = wrnd(p, x => use(f,x)[0]); used.add(f+'|'+g);
  const [i, j] = pickOpt(f, g);
  return {f, e:'', g, i, j, d:''};
}
function recent(){ const c = P.clients[S.client]; const set = new Set(); if(c && c.hist && P.set.vary) c.hist.slice(0,2).forEach(h => h.lines.forEach(l => set.add(l[0]+'|'+l[1]))); return set; }
function gen(id){
  const t = TEMPLATES.find(x => x.id === id); const n = P.set.count;
  let seq = []; for(let k=0; seq.length < n; k++) seq.push(t.seq[k % t.seq.length]);
  if(n < t.seq.length){ seq = t.seq.slice(0, n-1); seq.push(t.seq[t.seq.length-1]); }
  const used = new Set(), avoid = recent(), out = [];
  seq.forEach(f0 => { const need = f0.endsWith('!'); const l = pick(f0.replace('!',''), used, avoid, need); if(l) out.push(l); });
  setLines(out, t.name);
}

const cat = (f,g,i) => { const u = use(f,g,i||''), n = u[0], rec = u[1]; if(!i) return (n >= 5 || rec >= 1) ? 'used' : (n >= 1 ? 'rare' : 'never'); return n >= 3 ? 'used' : (n >= 1 ? 'rare' : 'never'); };

  if(a==='triplan'){ const y = window.scrollY; if(v==='reset') P.tri = {}; renderTri(); window.scrollTo(0,y); persist(); toast('Tri mis à jour'); return; }
  if(a==='trif'){ S.triF = v; renderTri(); window.scrollTo(0,0); return; }
  if(a==='triopen'){ const y = window.scrollY; S.triOpen[b.dataset.k] = !S.triOpen[b.dataset.k]; renderTri(); window.scrollTo(0,y); return; }
  if(a==='triall'){ const y = window.scrollY; const [f,g] = b.dataset.k.split('|'); const ft = S.triFilt || 'rare'; opts(f,g).filter(i => cat(f,g,i) === ft).forEach(i => setTri(f+'|'+g+'|'+i, v)); renderTri(); window.scrollTo(0,y); persist(); return; }
  if(a==='trifam'){ const y = window.scrollY; const ft = S.triFilt || 'rare'; exos(S.triF).filter(g => cat(S.triF,g) === ft).forEach(g => setTri(S.triF+'|'+g, v)); renderTri(); window.scrollTo(0,y); persist(); return; }
  if(a==='msel'){ const m = S.msel; const k = m.indexOf(v); if(k>=0) m.splice(k,1); else m.push(v); renderPresets(); return; }
  if(a==='mgen'){ genMuscle(); return; }
  if(a==='mus'){ const y = window.scrollY; const key = b.dataset.k; const [f,g] = key.split('|'); const cur = (P.mus[key] || baseGroups(f,g)).slice(); const k = cur.indexOf(v); if(k>=0) cur.splice(k,1); else cur.push(v); P.mus[key] = cur; resetTags(); renderTri(); window.scrollTo(0,y); persist(); return; }
  if(a==='musreset'){ const y = window.scrollY; delete P.mus[b.dataset.k]; resetTags(); renderTri(); window.scrollTo(0,y); persist(); return; }
  if(a==='mode'){ S.mode = v; renderAll(); window.scrollTo(0,0); return; }
  if(a==='num'){ S.num = Math.max(1, (+S.num||1) + +v); $('num').value = S.num; persist(); return; }
  if(a==='wnew'){ buildWarm(); persist(); return; }
  if(a==='wrm'){ S.wl.splice(n,1); renderWarm(); persist(); return; }
  if(a==='copywarm'){ copy(tsvWarm(), 'Échauffement copié'); return; }
  if(a==='gen'){ gen(v); return; }
  if(a==='count'){ P.set.count = Math.min(40, Math.max(6, P.set.count + +v)); $('cnt').textContent = P.set.count; persist(); return; }
  if(a==='mat'){ const m = P.set.mat; const i = m.indexOf(v); if(i>=0) m.splice(i,1); else m.push(v); renderPresets(); persist(); return; }
  if(a==='flag'){ P.set[v] = !P.set[v]; renderPresets(); persist(); return; }
  if(a==='pre'){ const p = PRE[+v]; setLines(p.lines.map(r => ({f:r[0],e:r[1]||'',g:r[2],i:r[3]||'',j:r[4]||'',d:r[5]||''})), p.name); return; }
  if(a==='sav'){ const p = P.saved[+v]; setLines(JSON.parse(JSON.stringify(p.lines)), p.name); return; }
  if(a==='savdel'){ P.saved.splice(+v,1); renderPresets(); persist(); toast('Séance supprimée de la liste'); return; }
  if(a==='reroll'){ reroll(n); renderLines(); persist(); return; }
  if(a==='note'){ S.open[n] = !S.open[n]; renderLines(); return; }
  if(a==='up' && n>0){ [S.lines[n-1],S.lines[n]] = [S.lines[n],S.lines[n-1]]; renderLines(); persist(); return; }
  if(a==='dn' && n<S.lines.length-1){ [S.lines[n+1],S.lines[n]] = [S.lines[n],S.lines[n+1]]; renderLines(); persist(); return; }
  if(a==='rm'){ S.undo = {lines:S.lines.slice(), title:S.title}; S.lines.splice(n,1); renderLines(); renderBar(); persist(); return; }
  if(a==='add'){ S.undo = {lines:S.lines.slice(), title:S.title}; S.lines.push({f:b.dataset.f,e:'',g:b.dataset.g,i:'',j:'',d:''}); $('q').value=''; $('found').innerHTML=''; renderLines(); renderBar(); persist(); toast('Ajouté en fin de séance'); return; }
  if(a==='tick'){ S.skip[b.dataset.k] = !S.skip[b.dataset.k]; renderCours(); persist(); return; }
  if(a==='copy'){ if(!keptLines().length){ toast('Aucun exercice à copier'); return; } copy(tsv(), 'Copié : sélectionne D10 dans Excel et colle'); return; }
  if(a==='cpclose'){ $('cpbox').style.display = 'none'; return; }
  if(a==='undo'){ if(S.undo){ S.lines = S.undo.lines; S.title = S.undo.title; S.undo = null; S.skip = {}; syncHead(); renderAll(); persist(); toast('Annulé'); } return; }
  if(a==='save'){
    const name = (S.title||'').trim();
    if(!S.lines.length){ toast('Aucun exercice à enregistrer'); return; }
    if(!name){ toast('Donne d\'abord un nom dans « Séance » (en haut)'); $('title').focus(); return; }
    const entry = {name, lines: S.lines.map(l => Object.assign({}, l))};
    const k = P.saved.findIndex(x => x.name === name); if(k>=0) P.saved[k] = entry; else P.saved.push(entry);
    renderPresets(); persist(); toast('« '+name+' » ajoutée aux prédéfinies'); return;
  }
  if(a==='done'){
    const c = S.client.trim();
    if(!c){ toast('Indique le nom du client'); $('client').focus(); return; }
    if(!keptLines().length){ toast('Aucun exercice dans la séance'); return; }
    const rec = P.clients[c] || {last:0, hist:[]};
    rec.hist.unshift({date:S.date, num:+S.num, title:S.title, lines:keptLines().map(l => [l.f,l.g])});
    rec.hist = rec.hist.slice(0,8); rec.last = +S.num; P.clients[c] = rec;
    S.num = rec.last + 1; S.skip = {};
    syncHead(); renderAll(); persist(); toast('Séance n° '+rec.last+' ('+rec.hist[0].lines.length+' exercices faits) enregistrée pour '+c+'. Prochaine : n° '+S.num);
    return;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id==='client'){ onClient(); return; }
  if(t.id==='title'){ S.title = t.value; persist(); return; }
  if(t.id==='num'){ S.num = Math.max(1, parseInt(t.value,10)||1); t.value = S.num; persist(); return; }
  if(t.id==='date'){ S.date = t.value || todayISO(); syncHead(); if(S.mode==='cours') renderCours(); persist(); return; }
  const fld = t.dataset && t.dataset.field; if(!fld) return;
  const n = +t.dataset.n, l = S.lines[n]; if(!l) return;
  if(fld==='f'){ l.f = t.value; l.g = exos(l.f)[0] || ''; l.i = ''; l.j = ''; l.e = ''; }
  else if(fld==='g'){ l.g = t.value; l.i = ''; l.j = ''; l.e = ''; }
  else if(fld==='i'){ l.i = t.value; l.j = ''; }
  else if(fld==='j'){ l.j = t.value; }
  else if(fld==='d'){ l.d = t.value; persist(); return; }
  renderLines(); persist();
});
$('client').addEventListener('input', () => { const v = $('client').value.trim(); if(P.clients[v]) onClient(); });
$('q').addEventListener('input', search);

S.date = todayISO(); syncHead(); renderAll(); initStore();
</script>
