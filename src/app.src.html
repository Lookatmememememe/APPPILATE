<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Séances Pilates</title>
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0C7566">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pilates">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Mise en page : une colonne étroite, lisible sur iPad et téléphone ; en-tête, échauffement, composition, liste d'exercices, barre d'actions collée en bas. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --ink:#16241F; --muted:#5B6D67; --line:#D6DFDB;
  --accent:#0C7566; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA; --warm:#B4530A; --done:#9AA9A4;
  --display:'Bricolage Grotesque','Avenir Next',system-ui,sans-serif; --body:'Figtree','Avenir Next',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1715; --surface:#18231F; --ink:#E7EFEC; --muted:#93A6A0; --line:#2B3B36;
  --accent:#4CC2AE; --accent-ink:#06211B; --accent-soft:#1D3A34; --warm:#F0A15C; --done:#5E706A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1715; --surface:#18231F; --ink:#E7EFEC; --muted:#93A6A0; --line:#2B3B36;
  --accent:#4CC2AE; --accent-ink:#06211B; --accent-soft:#1D3A34; --warm:#F0A15C; --done:#5E706A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);padding-inline:16px;padding-block:16px 120px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:26px} h2{font-size:19px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);padding:10px 16px;font:600 15px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{font:16px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;min-height:44px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:500}
textarea{min-height:64px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num-wrap{display:flex;gap:6px}.num-wrap input{text-align:center;font-variant-numeric:tabular-nums}
.btn{font:600 15px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.btn.sq{width:44px;padding:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hint{color:var(--muted);font-size:14px;margin:0}
.date{font-family:var(--display);font-size:18px}
ol.steps{margin:0;padding-left:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));column-gap:20px;gap:4px 20px}
ol.steps li{padding-left:2px}ol.steps small{color:var(--muted)}
details summary{cursor:pointer;font-weight:600;color:var(--muted)}
.set{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.ln{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.ln .g{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:end}
.ln .g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-left:36px}
.ln .idx{font:700 15px var(--display);color:var(--accent);padding-bottom:12px;text-align:center}
.ln .act{display:flex;flex-wrap:wrap;gap:6px;padding-left:36px}
.ln .star{color:var(--warm);font-weight:700}
.seg.s button{padding:7px 11px;font-size:14px}
.seg button[aria-pressed="true"][data-v="r"]{background:var(--accent-soft);color:var(--ink);box-shadow:inset 0 0 0 2px var(--accent)}
.seg button[aria-pressed="true"][data-v="x"]{background:var(--warm);color:var(--accent-ink)}
.tr{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.tr .h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tr .nm{font:600 17px var(--display);overflow-wrap:anywhere;min-width:0;flex:1 1 200px}
.tr small{color:var(--muted);font-weight:500;font-family:var(--body);font-size:13px}
.tr .opt{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:space-between;padding:6px 0 6px 12px;border-top:1px solid var(--line)}
.tr .opt span{flex:1 1 200px;min-width:0;overflow-wrap:anywhere;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .btn.has{border-color:var(--accent)}
.mc{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border-radius:20px;padding:2px 9px;margin:0 6px 0 0}
.mcs{display:flex;flex-wrap:wrap;gap:4px 0;padding-left:36px}
.mtxt{color:var(--muted);font-size:14px;margin-top:4px}
.found{display:flex;flex-direction:column;gap:6px}
.found button{text-align:left}
.found small{color:var(--muted)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar .msg{flex:1 1 100%;font-size:14px;color:var(--accent);min-height:18px;font-weight:600}
.cp{display:flex;flex-direction:column;gap:8px}
.cours-head{display:flex;flex-direction:column;gap:2px}
.cours-head .big{font:700 26px var(--display)}
.tk{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font:inherit}
.tk .box{flex:0 0 28px;height:28px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font:700 14px var(--display);color:var(--accent);margin-top:1px}
.tk[aria-pressed="true"] .box{background:var(--warm);color:var(--accent-ink)}
.tk .no{display:none;font-size:13px;font-weight:600;color:var(--warm);margin-top:2px}
.tk[aria-pressed="true"] .no{display:block}
.tk[aria-pressed="true"] .t{color:var(--done);text-decoration:line-through}
.tk .t{font:600 20px/1.25 var(--display);overflow-wrap:anywhere}
.tk .s{color:var(--muted);font-size:17px;margin-top:2px;overflow-wrap:anywhere}
.tk[aria-pressed="true"] .s{color:var(--done)}
.det{margin:-6px 0 0 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 10px 10px 0;font-size:16px}
.tkw{display:flex;flex-direction:column;gap:6px}
.sub-t{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
/* Téléphone (≤ 600 px) : une seule colonne, boutons plus larges au pouce, barre du bas en grille de 2 colonnes */
@media (max-width:600px){
  body{padding-inline:12px;padding-block:12px 210px}
  main{gap:12px}
  .card{padding:14px;gap:10px;border-radius:12px}
  h1{font-size:22px}
  .top{flex-direction:column;align-items:stretch;gap:10px}
  .seg{width:100%}
  .seg button{flex:1 1 0;min-width:0;padding:10px 4px;font-size:14px}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .num-wrap{min-width:0}
  .num-wrap input{min-width:0;width:100%}
  .btn{padding:10px 12px}
  .btn.sm{padding:8px 10px}
  .chips{gap:8px}
  .row{gap:8px}
  .tr .h{flex-direction:column;align-items:stretch}
  .tr .nm{flex-basis:auto}
  .tr .opt span{flex-basis:100%}
  .seg.s{width:100%}
  .seg.s button{flex:1 1 0;padding:8px 2px;font-size:13px}
  .tk{padding:12px}
  .tk .t{font-size:18px}
  .cours-head .big{font-size:22px}
  .bar{padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  .bar .in{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .bar .msg:empty{display:none}
  .bar .msg{grid-column:1/-1;font-size:14px;text-align:center}
  .bar .btn{min-width:0;padding:8px 6px;font-size:14px;line-height:1.2}
  .bar .btn.pri{grid-column:1/-1}
}
</style>
</head>
<body>

<main id="app">
  <div class="top">
    <h1>Séances Pilates</h1>
    <div class="seg" role="group" aria-label="Mode">
      <button id="m-prep" data-act="mode" data-v="prep" aria-pressed="true">Préparer</button>
      <button id="m-cours" data-act="mode" data-v="cours" aria-pressed="false">Cours</button>
      <button id="m-tri" data-act="mode" data-v="tri" aria-pressed="false">Trier ma base</button>
    </div>
  </div>

  <section class="card" id="head" aria-label="En-tête de séance">
    <div class="grid">
      <label class="f">Client
        <input id="client" list="clients" autocomplete="off" placeholder="Prénom du client">
        <datalist id="clients"></datalist>
      </label>
      <label class="f">Séance
        <input id="title" autocomplete="off" placeholder="ex. Abdos alter">
      </label>
      <label class="f">N° de séance
        <div class="num-wrap"><button class="btn sq" data-act="num" data-v="-1" aria-label="Numéro précédent">−</button><input id="num" inputmode="numeric"><button class="btn sq" data-act="num" data-v="1" aria-label="Numéro suivant">+</button></div>
      </label>
      <label class="f">Date
        <input id="date" type="date">
      </label>
    </div>
    <div class="row"><span class="date" id="datefr"></span><span class="hint" id="lastinfo"></span></div>
  </section>

  <div id="prep" style="display:contents">
    <section class="card" id="warm" aria-label="Échauffement"></section>
    <section class="card" id="presets" aria-label="Choisir une séance"></section>
    <section class="card" id="lines" aria-label="Exercices de la séance"></section>
    <section class="card" aria-label="Ajouter un exercice">
      <h2>Ajouter un exercice</h2>
      <label class="f">Chercher dans ta base
        <input id="q" autocomplete="off" placeholder="ex. shoulder bridge, clams, swan…">
      </label>
      <div class="found" id="found"></div>
    </section>
  </div>
  <div id="cours" style="display:none;flex-direction:column;gap:12px"></div>
  <div id="tri" style="display:none;flex-direction:column;gap:12px"></div>
  <section class="card cp" id="cpbox" style="display:none">
    <p class="hint">La copie automatique n'a pas fonctionné ici. Le texte est sélectionné : copie-le (⌘C / appui long → Copier), puis colle-le en D10.</p>
    <textarea id="cptext" rows="8" readonly></textarea>
    <button class="btn" data-act="cpclose">Fermer</button>
  </section>
</main>

<div class="bar"><div class="in">
  <div class="msg" id="msg" role="status"></div>
  <button class="btn pri" data-act="copy">Copier pour Excel (D10)</button>
  <button class="btn" data-act="done">Séance faite ✓</button>
  <button class="btn" data-act="save">Enregistrer comme prédéfinie</button>
  <button class="btn" data-act="undo" id="undo" style="display:none">Annuler</button>
</div></div>

<script>
const DATA = __DATA__;
const USE = DATA.USE, STATS = {seances:1694, lignes:26820, depuis:2020};
const F = DATA.F, T = DATA.T, PRE = DATA.P.filter(p => !/^Couple/.test(p.name));
const KEY = 'pilates-lud-v1';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[_/()+°*]/g,' ').replace(/\s+/g,' ').trim();
const todayISO = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset()*60000).toISOString().slice(0,10); };

// Échauffement : 10 propositions
const TEMPLATES = [
  {id:'abdos', name:'Abdos + haltères', seq:['MOBILITÉ','ABDOS','BRAS_HALTÈRES!','ABDOS','ABDOS_SIDE','CEINTURE_SCA!','ABDOS','FESSIERS_ADD','ABDOS','BRAS_HALTÈRES!','ABDOS_SIDE','DOS','ABDOS','SPINE_STRETCH','ETIREMENT']},
  {id:'bras', name:'Bras + haltères', seq:['ROLL_DOWN','BRAS_HALTÈRES!','CEINTURE_SCA!','BRAS_HALTÈRES!','ABDOS','BRAS_ONLY','BRAS_HALTÈRES!','FESSIERS_ADD','CEINTURE_SCA!','BRAS_CERCLE','BRAS_BAND','ABDOS_SIDE','BRAS_HALTÈRES!','ETIREMENT']},
  {id:'fess', name:'Fessiers + haltères', seq:['EQUILIBRE','FESSIERS_ADD','BRAS_HALTÈRES!','FESSIERS_ADD','ABDOS','FESSIERS_ADD','CEINTURE_SCA!','FESSIERS_ADD','MAT_FOOTWORK ','FESSIERS_ADD','ETIREMENT']},
  {id:'dos', name:'Dos + haltères', seq:['MOBILITÉ','DOS','CEINTURE_SCA!','ABDOS','DOS','BRAS_HALTÈRES!','QUADRUPÉDIE','DOS','ABDOS_SIDE','SPINE_STRETCH','ETIREMENT']},
  {id:'full', name:'Full body + haltères', seq:['ROLL_DOWN','ABDOS','BRAS_HALTÈRES!','FESSIERS_ADD','CEINTURE_SCA!','ABDOS_SIDE','DOS','EQUILIBRE','BRAS_HALTÈRES!','FESSIERS_ADD','ROLLING','SPINE_STRETCH','ETIREMENT']},
  {id:'mob', name:'Mobilité douce (sans poids)', seq:['RESPIRATION','ROLL_DOWN','MOBILITÉ','BASSIN','SPINE_STRETCH','NUQUE','CEINTURE_SCA','ROLLING','DOS','ETIREMENT','STRETCH_FASCIAS']},
];
// Échauffement adapté : tout le corps, de la tête aux pieds, avec plus de place pour les zones travaillées ensuite
const WU = {
  tete:['TÊTE','CERCLES TÊTE','FLEXION LAT LOOSE','FLEXION LAT LOOSE + ROT','RETRACT MENTON','LISTENING EARS'],
  epaules:['HAUSSER ÉPAULES','ROULER ÉPAULES','RETRAC/PROTAC ÉPAULE','CERCLES ÉPAULES','ROT LAT COUDES OPEN','ETIREMENT POITRINE'],
  bras:['CERCLES DE BRAS','FLEX EXT (E/D)','ABD/ADD (E/T/D)','ROT LAT','UP  V CERCLES BRAS'],
  poignets:['POIGNETS'],
  buste:['ROLL DOWN','BUSTE','SPINE TWIST LOOSE','SPINE TWIST','DOS ROND','MERMAID LOOSE'],
  hanches:['RETRO /ANTÉVERSION','ROTATION HANCHE','FENTE BASCULE AV/AR','PASSAGE HAIES','CONNECT GD FESSIER'],
  jambes:['APPRENDRE SQUAT','SQUAT SUMO','MONTER GENOUX ','PAS DE FOURMI AV/AR','SQUAT JAMBES SERRÉES'],
  pieds:['ROTATION CHEVILLES','BASCULE PIED AV/AR','HEELS RAISE','UP POINTES','MOLLETS'],
  equilibre:['EQUI PLIER 1 JAMBE','ÉQUI DIAGONAL°','EQUI SUR POINTES','ÉQUILIBRE TWIST']
};
const WU_ORDER = ['tete','epaules','bras','poignets','buste','hanches','jambes','pieds','equilibre'];
const WU_BASE = {tete:1,epaules:1,bras:1,buste:1,hanches:1,jambes:1,pieds:1};
const WU_FOCUS = {ABDOS:['buste','hanches'],ABDOS_SIDE:['buste','hanches'],FESSIERS_ADD:['hanches','jambes','pieds'],MAT_FOOTWORK:['hanches','jambes','pieds'],STABI_HANCHE:['hanches','jambes'],
  EQUILIBRE:['equilibre','jambes','pieds'],DOS:['buste','epaules'],SPINE_STRETCH:['buste'],ROLLING:['buste'],'MOBILITÉ':['buste','hanches'],ROLL_DOWN:['buste'],BASSIN:['hanches'],
  BRAS_ONLY:['epaules','bras','poignets'],'BRAS_HALTÈRES':['epaules','bras','poignets'],BRAS_CERCLE:['epaules','bras'],BRAS_BAND:['epaules','bras'],CEINTURE_SCA:['epaules','bras'],
  'QUADRUPÉDIE':['poignets','epaules','hanches'],NUQUE:['tete','epaules'],CERVICALES:['tete','epaules']};
const GZ = {abdos:['buste','hanches'],obliques:['buste','hanches'],dos:['buste','epaules'],scap:['epaules','bras'],epaules:['epaules','bras','poignets'],pecs:['epaules','bras'],biceps:['bras','poignets','epaules'],triceps:['bras','poignets','epaules'],avbras:['poignets','bras'],
  fessiers:['hanches','jambes'],quadri:['hanches','jambes','pieds'],ischios:['hanches','jambes'],add:['hanches','jambes'],psoas:['hanches','jambes'],mollets:['pieds','jambes','equilibre'],nuque:['tete','epaules'],peri:['buste','hanches'],mob:['buste']};
function buildWarm(){
  const count = {};
  S.lines.forEach(l => { muscles(l.f,l.g,l.i,l.j).slice(0,2).forEach(x => (GZ[x] || []).forEach(z => { count[z] = (count[z]||0) + 1; })); if(l.f.trim()==='EQUILIBRE') count.equilibre = (count.equilibre||0) + 1; });
  const out = []; S.focus = Object.keys(count).sort((a,b) => count[b]-count[a]);
  WU_ORDER.forEach(z => {
    let n = WU_BASE[z] || 0;
    if(count[z]) n = Math.max(n,1) + (count[z] >= 2 ? 1 : 0) + (count[z] >= 5 ? 1 : 0);
    if(n > WU[z].length) n = WU[z].length;
    const pool = WU[z].slice(); for(let k=0;k<n;k++){ const g = pool.splice(Math.floor(Math.random()*pool.length),1)[0]; out.push([g, g==='ROLL DOWN'?'FLEXION EXTENSION':'']); }
  });
  S.wl = out.slice(0,14); renderWarm();
}
const MATS = ['band','haltères','balle','ballon'];

// État
let P = {clients:{}, saved:[], tri:{}, mus:{}, set:{mat:MATS.slice(), baseOnly:false, noQuad:false, vary:true, rare:false, fav:true, count:20}};
let S = {msel:[], triF:null, triOpen:{}, mode:'prep', client:'', title:'', num:1, date:todayISO(), wl:[], focus:[], lines:[], skip:{}, open:{}, undo:null};

const fams = f => Object.keys(F);
const exos = f => Object.keys(F[f] || {});
const opts = (f,g) => Object.keys((F[f]||{})[g] || {});
const subs = (f,g,i) => Object.keys((((F[f]||{})[g])||{})[i] || {});
const rnd = a => a[Math.floor(Math.random()*a.length)];
const use = (f,g,i) => USE[f+'|'+g+(i ? '|'+i : '')] || [0,0];
const wt = n => 1 + Math.log(1 + n);
function wrnd(items, nf){
  if(!P.set.fav) return rnd(items);
  const ws = items.map(x => wt(nf(x))); let t = ws.reduce((a,b) => a+b, 0), r = Math.random()*t;
  for(let k=0;k<items.length;k++){ r -= ws[k]; if(r <= 0) return items[k]; }
  return items[items.length-1];
}
function wshuf(arr, nf){
  return arr.map(x => [Math.pow(Math.random(), 1/(P.set.fav ? wt(nf(x)) : 1)), x]).sort((a,b) => b[0]-a[0]).map(a => a[1]);
}
const tri = (...k) => P.tri[k.join('|')] || '';
const allowed = st => st === '' || (st === 'r' && P.set.rare);
function pickOpt(f, g){
  const o = opts(f,g).filter(i => allowed(tri(f,g,i)));
  const i = o.length && Math.random() < .85 ? wrnd(o, x => use(f,g,x)[0]) : '';
  const sb = i ? subs(f,g,i) : []; const j = sb.length && Math.random() < .5 ? rnd(sb) : '';
  return [i, j];
}

// Mémoire (base partagée si disponible, sinon navigateur)
let DBDOC = null, saveT = null;
function localLoad(){ try{ const j = localStorage.getItem(KEY); return j ? JSON.parse(j) : null; }catch(e){ return null; } }
function localSave(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
function snapshot(){ return {P, draft:{client:S.client,title:S.title,num:S.num,wl:S.wl,lines:S.lines,skip:S.skip}}; }
function persist(){
  clearTimeout(saveT);
  saveT = setTimeout(() => { const o = snapshot(); localSave(o); if(DBDOC){ DBDOC.set({json: JSON.stringify(o)}).catch(()=>{}); } }, 400);
}
function applySaved(o){
  if(!o) return;
  if(o.P){ P = Object.assign(P, o.P); P.set = Object.assign({mat:MATS.slice(),baseOnly:false,noQuad:false,vary:true,rare:false,fav:true,count:20}, o.P.set||{}); P.tri = P.tri || {}; P.mus = P.mus || {}; }

// Génération
function pool(f, used, avoid, need){
  const s = P.set;
  const all = exos(f).filter(g => !used.has(f+'|'+g) && allowed(tri(f,g)));
  let ok = all.filter(g => {
    const t = T[f+'|'+g]; if(!t) return true;
    if(t[1] !== 'sans' && !s.mat.includes(t[1])) return false;
    if(s.noQuad && t[2] === 'quadrupédie') return false;
    if(s.baseOnly && t[3] && t[3] !== 'base') return false;
    return true;
  });
  if(need && s.mat.includes('haltères')){ const h = ok.filter(g => T[f+'|'+g] && T[f+'|'+g][1]==='haltères'); if(h.length) ok = h; }
  if(avoid){ const b = ok.filter(g => !avoid.has(f+'|'+g)); if(b.length) ok = b; }
  return ok.length ? ok : all;
}
function pick(f, used, avoid, need){
  const p = pool(f, used, avoid, need); if(!p.length) return null;
  const g = wrnd(p, x => use(f,x)[0]); used.add(f+'|'+g);
  const [i, j] = pickOpt(f, g);
  return {f, e:'', g, i, j, d:''};
}
function recent(){ const c = P.clients[S.client]; const set = new Set(); if(c && c.hist && P.set.vary) c.hist.slice(0,2).forEach(h => h.lines.forEach(l => set.add(l[0]+'|'+l[1]))); return set; }
function gen(id){
  const t = TEMPLATES.find(x => x.id === id); const n = P.set.count;
  let seq = []; for(let k=0; seq.length < n; k++) seq.push(t.seq[k % t.seq.length]);
  if(n < t.seq.length){ seq = t.seq.slice(0, n-1); seq.push(t.seq[t.seq.length-1]); }
  const used = new Set(), avoid = recent(), out = [];
  seq.forEach(f0 => { const need = f0.endsWith('!'); const l = pick(f0.replace('!',''), used, avoid, need); if(l) out.push(l); });
  setLines(out, t.name);
}

    rec.hist.unshift({date:S.date, num:+S.num, title:S.title, lines:keptLines().map(l => [l.f,l.g])});
    rec.hist = rec.hist.slice(0,8); rec.last = +S.num; P.clients[c] = rec;
    S.num = rec.last + 1; S.skip = {};
    syncHead(); renderAll(); persist(); toast('Séance n° '+rec.last+' ('+rec.hist[0].lines.length+' exercices faits) enregistrée pour '+c+'. Prochaine : n° '+S.num);
    return;
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id==='client'){ onClient(); return; }
  if(t.id==='title'){ S.title = t.value; persist(); return; }
  if(t.id==='num'){ S.num = Math.max(1, parseInt(t.value,10)||1); t.value = S.num; persist(); return; }
  if(t.id==='date'){ S.date = t.value || todayISO(); syncHead(); if(S.mode==='cours') renderCours(); persist(); return; }
  const fld = t.dataset && t.dataset.field; if(!fld) return;
  const n = +t.dataset.n, l = S.lines[n]; if(!l) return;
  if(fld==='f'){ l.f = t.value; l.g = exos(l.f)[0] || ''; l.i = ''; l.j = ''; l.e = ''; }
  else if(fld==='g'){ l.g = t.value; l.i = ''; l.j = ''; l.e = ''; }
  else if(fld==='i'){ l.i = t.value; l.j = ''; }
  else if(fld==='j'){ l.j = t.value; }
  else if(fld==='d'){ l.d = t.value; persist(); return; }
  renderLines(); persist();
});
$('client').addEventListener('input', () => { const v = $('client').value.trim(); if(P.clients[v]) onClient(); });
$('q').addEventListener('input', search);

S.date = todayISO(); syncHead(); renderAll(); initStore();
</script>
